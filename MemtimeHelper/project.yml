name: MemtimeHelper
options:
  bundleIdPrefix: com.memtimehelper
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
# Signing lives in Signing.xcconfig, not in target settings: target settings
# override xcconfig values, so a signing key here blocks the local override.
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
targets:
  MemtimeHelper:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: MemtimeHelper
        excludes:
          - "**/*Tests*"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.memtimehelper.MemtimeHelper
        SWIFT_VERSION: 5.9
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        INFOPLIST_FILE: MemtimeHelper/Info.plist
    entitlements:
      path: MemtimeHelper/MemtimeHelper.entitlements
  MemtimeHelperTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - MemtimeHelperTests
    dependencies:
      - target: MemtimeHelper
    settings:
      base:
        SWIFT_VERSION: 5.9
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        GENERATE_INFOPLIST_FILE: YES
